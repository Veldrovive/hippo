[project]
name = "hippo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aidan Dempster", email = "aidan.dempster@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bd-warehouse>=0.4.0",
    "build123d>=0.13.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "ocp-vscode>=4.2.0",
    "pillow>=13.0.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
hippo = "hippo.cli:main"
